name: Publicar build de Agathia
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo probar (no publica en npm)'
        type: boolean
        default: true
  push:
    branches:
      - fix/agathia-safe-conversation-close
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release @uniksolana/capacitor-llm 8.2.1-agathia.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: node scripts/agathia-patch.mjs
      - run: bun run build
      - name: Verificar compilación Android
        run: bun run verify:android
      - name: Comprobar contenido del paquete
        run: npm pack --dry-run
      - name: Publicar o simular publicación
        run: npm publish --access public --ignore-scripts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
